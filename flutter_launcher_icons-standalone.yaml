# standalone 변형 전용 런처 아이콘 설정.
#
# 생성:  flutter pub run flutter_launcher_icons -f standalone
#   -> android/app/src/standalone/res/mipmap-* 에 ic_launcher 를 생성한다
#      (update 변형 아이콘은 pubspec.yaml 의 flutter_launcher_icons 블록이 담당).
#
# 배경은 로그인 화면과 동일한 대각선 그라데이션(#fb3e7e -> #9843cb)을 적용한다.
# 그라데이션 PNG 는 tool/gen_standalone_icon.dart 로 생성한다(색 변경 시 재실행 후
# 이 설정으로 아이콘 재생성). 전경은 흰색 "w." 로고(투명 배경).
#
# windows 키는 두지 않는다. Windows 아이콘은 Runner.rc 의 단일 IDI_APP_ICON 을
# 공유하며, 변형 구분이 필요하면 Runner.rc 에서 별도 분기한다(현재 범위 밖).
flutter_launcher_icons:
  android: true
  ios: false
  # 레거시(비-adaptive) 런처용: 그라데이션 + 로고 합성본
  image_path: "assets/icons/app_icon_standalone.png"
  min_sdk_android: 24
  # adaptive: 그라데이션 배경 + 투명 배경 흰색 로고 전경
  adaptive_icon_background: "assets/icons/app_icon_standalone_bg.png"
  adaptive_icon_foreground: "assets/icons/app_icon_transparent.png"
