name: appfit_order_agent
description: "waldlust appfit order agent"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.0.3+200
environment:
  sdk: ^3.5.0
  flutter: ">=3.19.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  connectivity_plus: ^6.0.3
  intl: ^0.20.2
  table_calendar: ^3.1.3
  archive: ^4.0.7
  path_provider: ^2.1.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  shared_preferences: ^2.2.2
  http: ^1.1.0
  riverpod_annotation: ^2.6.1

  # Define supported platforms
  audioplayers: ^6.4.0

  logger: ^2.5.0

  package_info_plus: ^9.0.0
  firebase_core: ^3.6.0
  flutter_downloader: ^1.11.0
  app_installer: ^1.3.1

  dio: ^5.8.0+1
  flutter_launcher_icons: ^0.14.4

  device_info_plus: ^12.3.0
  
  # V2 API 암호화를 위한 패키지
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_secure_storage: ^10.0.0

  # AppFit 공통 패키지
  appfit_core:
    git:
      url: https://github.com/ratm10/appifit_agent_core.git
      path: appfit_core
      ref: v1.5.0



  sentry_flutter: ^8.0.0
  
  # 환경 변수 관리
  # flutter_dotenv: ^5.1.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_layout_grid: ^2.0.8
  web_socket_channel: ^3.0.3
  qr: ^3.0.2 # QR 모듈 매트릭스 직접 래스터화(정수 픽셀·AA off·quiet zone) — label_painter
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # i18n
  slang: ^4.0.0
  slang_flutter: ^4.0.0

  # Native Feature Migration
  # flutter_overlay_window: ^0.5.0 # Removed for Revert
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  tray_manager: ^0.5.3
  launch_at_startup: ^0.5.1
  win32: ^5.15.0
  ffi: ^2.1.0
  serial_port_win32: ^1.2.8
  android_intent_plus: ^6.0.0
dev_dependencies:
  sentry_dart_plugin: ^3.2.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  dotted_line: ^3.2.3
  # 직접 import 하지만 미선언이던 dev 전용 의존(전이 의존에 기대던 것):
  # image=tool/ 아이콘·로고 생성 스크립트, fake_async=test/ 가상시계 타이머 테스트
  fake_async: ^1.3.1
  image: ^4.5.4


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# 단일 패키지 통합 런처 아이콘. 한국/일본 공통으로 그라데이션(#fb3e7e -> #9843cb)
# + 흰색 "w." 로고를 사용한다. 그라데이션 PNG 는 tool/gen_korea_icon.dart 로 생성.
# 재생성: flutter pub run flutter_launcher_icons  (인자 없이 이 블록 사용)
# windows 키는 두지 않는다 — Windows 아이콘은 정성 제작한 다해상도
# windows/runner/resources/app_icon.ico 를 직접 관리하며, 자동 생성이 이를
# 단일 256px 로 덮어쓰지 않도록 막는다.
flutter_launcher_icons:
  android: true
  ios: false
  # 레거시(비-adaptive) 런처용: 그라데이션 + 로고 합성본
  image_path: "assets/icons/app_icon_korea.png"
  min_sdk_android: 24
  # adaptive: 그라데이션 배경 + 투명 배경 흰색 로고 전경
  adaptive_icon_background: "assets/icons/app_icon_korea_bg.png"
  adaptive_icon_foreground: "assets/icons/app_icon_transparent.png"

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sounds/alert10.mp3
    - assets/sounds/alert_speech.m4a
    - assets/sounds/
    - assets/images/
    - assets/images/brand/
    - assets/images/brand/tokyoplatz/
    - assets/images/brand/mammoth/
    - assets/images/brand/mahataste/
    - assets/images/brand/paik/
    - assets/images/brand/theliterjp/
    - assets/icons/
    # - .env
  fonts:
    # Pretendard-Light(300) 은 선언하지 않는다 — FontWeight.w300 사용처가 0 이라
    # 1.6MB 를 번들에 얹기만 했다. Bold(700) 도 마찬가지로 선언하지 않는다:
    # FontWeight.bold 는 현재 SemiBold(600) 로 폴백해 렌더되고 있고, 여기에
    # Bold.otf 를 추가하면 APK 가 1.6MB 늘어난다.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package



sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: appfit-order-agent
  org: waldlust
