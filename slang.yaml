base_locale: ko
fallback_strategy: base_locale
input_directory: lib/i18n
input_file_pattern: .i18n.json
output_directory: lib/i18n
output_file_name: strings.g.dart
namespaces: false
translate_var: t
enum_name: AppLocale
key_case: snake
param_case: camel
flat_map: false
timestamp: true
string_interpolation: braces
# slang 4 는 기본 lazy 로딩(웹 deferred 용). 네이티브(Android/Windows) 전용인
# 이 앱은 3.x 의 동기 로딩 동작을 유지하기 위해 lazy 를 끈다. 이로써
# setLocaleSync / setPluralResolverSync 동기 API 를 계속 쓸 수 있다.
lazy: false
